<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pad d'entretien</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
<style>
  :root { --bg:#16181d; --panel:#1f2229; --line:#333843; --fg:#e6e8ec; --dim:#9aa1ad; --accent:#4f9cf9; --ok:#4cc38a; --priv:#b48cf2; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; }
  #status { color: var(--dim); flex: 1; min-width: 12ch; }
  #status.ok { color: var(--ok); }
  button { font: inherit; color: var(--fg); background: #2b303b; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button:disabled { opacity: .5; cursor: wait; }
  #run { background: var(--accent); border-color: var(--accent); color: #06121f; font-weight: 600; }
  body.priv #run { background: var(--priv); border-color: var(--priv); }
  input[type=text], input[type=password] { font: inherit; color: var(--fg); background: #2b303b; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  #me { width: 9rem; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(220px, 30%) 1fr; grid-template-rows: 1fr 30%; }
  section { display: flex; flex-direction: column; min-height: 0; min-width: 0; border: 0 solid var(--line); }
  #p-notes { grid-row: 1 / 3; border-right-width: 1px; }
  #p-out { border-top-width: 1px; }
  .bar, section > label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); padding: 6px 12px; margin: 0; background: var(--panel); }
  .bar { display: flex; gap: 4px; align-items: center; padding: 3px 6px; }
  .tab { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); background: none; border: 1px solid transparent; padding: 3px 8px; }
  .tab[aria-selected=true] { color: var(--fg); border-color: var(--line); background: var(--bg); }
  #tabPriv[aria-selected=true] { color: var(--priv); border-color: var(--priv); }
  .privtools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 4px 8px; background: var(--panel); border-top: 1px solid var(--priv); color: var(--priv); font-size: 12px; }
  .privtools button { padding: 2px 8px; font-size: 12px; }
  #notes { flex: 1; resize: none; border: 0; padding: 12px; background: var(--bg); color: var(--fg); font: 13px/1.5 ui-monospace, Consolas, monospace; }
  .ed { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .ed > .cmwrap { flex: 1; min-height: 0; }
  #ed-priv .cmwrap { box-shadow: inset 3px 0 0 var(--priv); }
  .CodeMirror { height: 100%; font: 14px/1.5 ui-monospace, Consolas, monospace; }
  .CodeMirror-hints { background: #2b303b; border-color: var(--line); font: 13px/1.5 ui-monospace, Consolas, monospace; z-index: 10; }
  .CodeMirror-hint { color: var(--fg); }
  li.CodeMirror-hint-active { background: var(--accent); color: #06121f; }
  header label { color: var(--dim); display: flex; gap: 4px; align-items: center; }
  select { font: inherit; color: var(--fg); background: #2b303b; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; max-width: 16rem; }
  select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  pre.out { flex: 1; margin: 0; padding: 12px; overflow: auto; white-space: pre-wrap; word-break: break-word; font: 13px/1.5 ui-monospace, Consolas, monospace; }
  #out-priv { box-shadow: inset 3px 0 0 var(--priv); }
  dialog { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 16px; width: min(440px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0, 0, 0, .5); }
  dialog h2 { font-size: 16px; margin: 0 0 12px; }
  dialog form { display: flex; gap: 8px; flex-wrap: wrap; }
  dialog ul { list-style: none; padding: 0; margin: 0 0 12px; }
  dialog li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  dialog .dim { color: var(--dim); font-size: 12px; }
  #pwErr { color: #f28b82; }
  .admintools { display: contents; }
  #nextStep { border-color: var(--ok); color: var(--ok); }
  #nextStep:disabled { cursor: default; }
  @keyframes flash { from { background: var(--ok); color: #06121f; } }
  .flash { animation: flash 1.5s ease-out; }
  @media (max-width: 700px) {
    main { grid-template-columns: 1fr; grid-template-rows: 25% 1fr 25%; }
    #p-notes { grid-row: auto; border-right-width: 0; border-bottom-width: 1px; }
  }
</style>
</head>
<body>
<header>
  <h1>Pad d'entretien</h1>
  <span id="status" role="status" aria-live="polite">Connexion…</span>
  <input type="text" id="me" placeholder="Ton prénom" aria-label="Ton prénom" maxlength="24">
  <span id="adminTools" class="admintools" hidden>
    <select id="sujet" aria-label="Charger un sujet"><option value="">Charger un sujet…</option></select>
    <button id="nextStep" type="button" hidden>Étape suivante</button>
  </span>
  <span id="clock" aria-label="Chronomètre">00:00</span>
  <label title="Décoche pour t'entraîner sans aide"><input type="checkbox" id="auto" checked> Auto-complétion</label>
  <button id="clockBtn" type="button">Démarrer le chrono</button>
  <button id="copy" type="button">Copier le lien</button>
  <button id="adminBtn" type="button">Admin</button>
  <button id="run" type="button" title="Ctrl+Entrée">▶ Exécuter</button>
</header>
<main>
  <section id="p-notes">
    <label for="notes" id="notesLabel">Sujet et notes (partagé)</label>
    <textarea id="notes" spellcheck="false" placeholder="Colle le sujet ici. Tout le monde le voit."></textarea>
  </section>
  <section id="p-code">
    <div class="bar" role="tablist" aria-label="Éditeur">
      <button class="tab" id="tabShared" role="tab" aria-selected="true" aria-controls="ed-shared">Code partagé</button>
      <button class="tab" id="tabPriv" role="tab" aria-selected="false" aria-controls="ed-priv" hidden>Mon brouillon privé</button>
    </div>
    <div class="ed" id="ed-shared" role="tabpanel" aria-labelledby="tabShared"><div class="cmwrap" id="editor"></div></div>
    <div class="ed" id="ed-priv" role="tabpanel" aria-labelledby="tabPriv" hidden>
      <div class="privtools">
        <span>Visible par toi seul, jamais envoyé.</span>
        <button type="button" id="copyShared">Copier le code partagé ici</button>
        <button type="button" id="openFile">Ouvrir un fichier .py</button>
        <input type="file" id="file" accept=".py,.txt" hidden>
      </div>
      <div class="cmwrap" id="editor-priv"></div>
    </div>
  </section>
  <section id="p-out">
    <label id="outLabel" for="out">Sortie (partagée)</label>
    <pre class="out" id="out" aria-live="polite" tabindex="0">Clique sur Exécuter ou fais Ctrl+Entrée.</pre>
    <pre class="out" id="out-priv" aria-live="polite" tabindex="0" hidden>Sortie de ton brouillon privé.</pre>
  </section>
</main>

<dialog id="adminDlg" aria-labelledby="adminTitle">
  <h2 id="adminTitle">Panneau admin</h2>
  <form id="pwForm" method="dialog">
    <input type="password" id="pw" placeholder="Mot de passe" aria-label="Mot de passe admin" autocomplete="off">
    <button type="submit" value="login">Déverrouiller</button>
    <span id="pwErr" role="alert"></span>
  </form>
  <div id="adminBody" hidden>
    <p class="dim">Coche pour accorder un brouillon privé. Ton propre brouillon est toujours disponible.</p>
    <ul id="roster"></ul>
    <button type="button" id="logout">Quitter le mode admin</button>
  </div>
  <form method="dialog" style="margin-top:12px"><button>Fermer</button></form>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="sujets.js"></script>
<script>
const $ = id => document.getElementById(id);
const PREFIX = 'pad-entretien-';
const store = {                          // localStorage peut être bloqué (navigation privée)
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// --- Salle : l'identifiant est dans le #hash de l'URL -----------------------
let room = location.hash.slice(1).replace(/[^a-z0-9-]/gi, '');
if (!room) room = Math.random().toString(36).slice(2, 8);
history.replaceState(null, '', '#' + room);
addEventListener('hashchange', () => location.reload());   // lien d'une autre salle collé dans le même onglet

// --- Auto-complétion : mots-clés Python + mots déjà présents dans le code ----
// ponytail: complétion par préfixe, sans analyse de types. Pour mieux, brancher jedi via Pyodide.
const PY_WORDS = ('False None True and as assert break class continue def del elif else except finally for from global ' +
  'if import in is lambda nonlocal not or pass raise return try while with yield ' +
  'abs all any bool dict enumerate filter float input int isinstance len list map max min print range reversed ' +
  'round set sorted str sum tuple type zip ValueError KeyError IndexError TypeError Exception ' +
  'append extend insert remove pop popleft appendleft clear index count sort reverse copy ' +
  'items keys values get setdefault update add discard join split strip startswith endswith replace lower upper format ' +
  'collections Counter defaultdict deque most_common heapq heappush heappop itertools functools math self __init__ __name__').split(' ');
function pyHint(c) {
  const cur = c.getCursor(), line = c.getLine(cur.line);
  let s = cur.ch;
  while (s && /\w/.test(line[s - 1])) s--;
  const pre = line.slice(s, cur.ch);
  if (pre.length < 2) return null;
  const words = new Set(PY_WORDS);
  (c.getValue().match(/[A-Za-z_]\w{2,}/g) || []).forEach(w => words.add(w));
  const list = [...words].filter(w => w.startsWith(pre) && w !== pre).sort();
  return list.length ? { list, from: CodeMirror.Pos(cur.line, s), to: cur } : null;
}
// Tab accepte la suggestion ; Entrée va toujours à la ligne (sinon "return total" + Entrée
// choisirait "total_sum" à la place).
const showHint = c => c.showHint({ hint: pyHint, completeSingle: false,
  extraKeys: { Enter: (cm, h) => { h.close(); cm.execCommand('newlineAndIndent'); } } });

// --- Éditeurs : le partagé et le brouillon privé ont les mêmes réglages --------
function makeEditor(el, onRun) {
  const ed = CodeMirror(el, {
    mode: 'python', theme: 'material-darker', lineNumbers: true, indentUnit: 4,
    autoCloseBrackets: true, matchBrackets: true,
    extraKeys: {
      'Ctrl-Space': showHint,
      Backspace: c => {                  // en début de ligne, efface un niveau d'indentation entier
        const p = c.getCursor(), before = c.getLine(p.line).slice(0, p.ch);
        if (c.somethingSelected() || !before || before.trim() || p.ch % 4) return CodeMirror.Pass;
        c.indentSelection('subtract');
      },
      Tab: c => c.somethingSelected() ? c.indentSelection('add') : c.replaceSelection('    '),
      'Shift-Tab': c => c.indentSelection('subtract'),
      'Ctrl-Enter': onRun, 'Cmd-Enter': onRun,
    },
  });
  ed.on('inputRead', (c, ch) => {
    if ($('auto').checked && ch.origin === '+input' && /\w/.test(ch.text[0])) showHint(c);
  });
  return ed;
}
const cm = makeEditor($('editor'), () => shared.run(cm.getValue()));
const cmP = makeEditor($('editor-priv'), () => priv.run(cmP.getValue()));
const notes = $('notes');
$('auto').addEventListener('change', e => [cm, cmP].forEach(ed => ed.setOption('autoCloseBrackets', e.target.checked)));

// Remplace tout le contenu en gardant l'historique (Ctrl+Z annule le remplacement).
function replaceAll(ed, text) { ed.operation(() => { ed.execCommand('selectAll'); ed.replaceSelection(text); }); }

// Sauvegarde locale : un rechargement de page ne perd pas le travail.
const KEY = 'pad:' + room;
function save() { store.set(KEY, JSON.stringify({ code: cm.getValue(), notes: notes.value })); }
try {
  const s = JSON.parse(store.get(KEY) || 'null');
  cm.setValue(s?.code ?? '# Écris ton code ici\nprint("hello")\n');
  notes.value = s?.notes ?? '';
} catch { cm.setValue(''); }
cmP.setValue(store.get('pad:prive') ?? '# Brouillon privé : rien de ce que tu tapes ici ne quitte ton navigateur.\n');
cmP.on('change', () => store.set('pad:prive', cmP.getValue()));

// --- Synchronisation ---------------------------------------------------------
// ponytail: l'hôte fait autorité, avec un numéro de version. Si deux personnes
// tapent exactement en même temps, la frappe de l'invité est annulée (resync).
// Pour de l'édition simultanée fine, passer à un CRDT (Yjs).
let isHost = false, conns = [], hostConn = null, ver = 0, rej = 0;

const snapshot = extra => ({ t: 'state', code: cm.getValue(), notes: notes.value, ver, ...extra });

function sendAll(msg, except) {
  if (isHost) conns.forEach(c => c !== except && c.open && c.send(msg));
  else if (hostConn?.open) hostConn.send(msg);
}

// Remplace seulement la partie du texte qui diffère, pour ne pas déplacer le curseur local.
function applyCode(text) {
  const cur = cm.getValue();
  if (cur === text) return;
  let s = 0, e = 0;
  while (s < cur.length && s < text.length && cur[s] === text[s]) s++;
  while (e < cur.length - s && e < text.length - s && cur[cur.length - 1 - e] === text[text.length - 1 - e]) e++;
  cm.replaceRange(text.slice(s, text.length - e), cm.posFromIndex(s), cm.posFromIndex(cur.length - e), 'remote');
}

function applyState(m) {
  if (typeof m.code !== 'string' || typeof m.notes !== 'string') return;
  applyCode(m.code);
  if (notes.value !== m.notes) {
    const a = notes.selectionStart, b = notes.selectionEnd;
    notes.value = m.notes;
    notes.setSelectionRange(a, b);
  }
  save();
}

function localEdit() {
  save();
  if (isHost) { ver++; sendAll(snapshot()); }
  else if (hostConn?.open) { hostConn.send({ t: 'edit', code: cm.getValue(), notes: notes.value, base: ver, rej }); ver++; }
}
cm.on('change', (_, ch) => { if (ch.origin !== 'remote' && ch.origin !== 'setValue') localEdit(); });
notes.addEventListener('input', localEdit);

function hostData(c, m) {
  if (m?.t === 'edit') {
    if (m.base !== ver || m.rej !== c.rej) { c.rej++; c.send(snapshot({ resync: true })); return; }
    applyState(m); ver++;
    sendAll(snapshot(), c);
  } else if (m?.t === 'out' || m?.t === 'clock' || m?.t === 'step') { handleShared(m); sendAll(m, c); }
  else if (m?.t === 'hello') {
    const r = roster.get(c.peer);
    if (r) { r.name = String(m.name || '').slice(0, 24); r.admin = !!m.admin; broadcastRoster(); }
  } else if (m?.t === 'grant' && roster.get(c.peer)?.admin) setGrant(m.id, m.allowed);
}
function guestData(m) {
  if (m?.t === 'state') { applyState(m); ver = m.ver; if (m.resync) rej++; if ('clock' in m) setClock(m.clock); }
  else if (m?.t === 'out' || m?.t === 'clock' || m?.t === 'step') handleShared(m);
  else if (m?.t === 'roster' && Array.isArray(m.list)) applyRoster(m.list);
}
function handleShared(m) {
  if (m.t === 'out') $('out').textContent = String(m.text);
  else if (m.t === 'step') {             // nouvelle étape du sujet : on la montre à tout le monde
    notes.scrollTop = notes.scrollHeight;
    const l = $('notesLabel');
    l.classList.remove('flash'); void l.offsetWidth; l.classList.add('flash');
  } else setClock(m.start);
}

// --- Participants et droits (tenus par l'hôte) ---------------------------------
// shortcut: le verrou admin est côté client. Il n'empêche pas un curieux muni des outils
// de développement de s'accorder un brouillon ; il ne peut en revanche jamais lire celui
// d'un autre, car un brouillon privé n'est jamais envoyé sur le réseau.
const ADMIN_HASH = '5c51d63089ff14923e12c19ab96ad20737f6c2ccf1512afd74af7ff42fbc0310';
let myName = store.get('pad:name') || '', isAdmin = store.get('pad:admin') === '1';
let myId = null, roster = new Map(), rosterList = [];
$('me').value = myName;

function broadcastRoster() {
  const list = [...roster].map(([id, r]) => ({ id, ...r }));
  sendAll({ t: 'roster', list });
  applyRoster(list);
}
function setGrant(id, allowed) {
  const r = roster.get(id);
  if (r) { r.allowed = !!allowed; broadcastRoster(); }
}
function announce() {                    // l'hôte met à jour sa propre ligne, l'invité prévient l'hôte
  if (isHost) { const r = roster.get('host'); if (r) { r.name = myName; r.admin = isAdmin; broadcastRoster(); } }
  else if (hostConn?.open) hostConn.send({ t: 'hello', name: myName, admin: isAdmin });
}
function applyRoster(list) {
  rosterList = list;
  const allowed = isAdmin || !!list.find(r => r.id === myId)?.allowed;
  $('tabPriv').hidden = !allowed;
  if (!allowed && activeTab === 'priv') showTab('shared');
  renderRoster();
}

$('me').addEventListener('change', () => {
  myName = $('me').value.trim();
  store.set('pad:name', myName);
  announce();
});

// --- Connexion pair à pair (PeerJS, sans serveur à nous) --------------------
function setStatus(text, ok) { $('status').textContent = text; $('status').classList.toggle('ok', !!ok); }
function hostStatus() {
  setStatus(conns.length ? `Connecté (${conns.length + 1} personnes)` : "En attente de l'autre personne. Envoie-lui le lien.", conns.length > 0);
}

function start() {                       // on essaie d'abord d'être l'hôte de la salle
  setStatus('Connexion…');
  const peer = new Peer(PREFIX + room);
  peer.on('open', () => {
    isHost = true; conns = []; myId = 'host';
    roster = new Map([['host', { name: myName, allowed: false, admin: isAdmin }]]);
    hostStatus(); broadcastRoster();
  });
  peer.on('connection', c => {
    c.rej = 0;
    c.on('open', () => {
      conns.push(c);
      roster.set(c.peer, { name: '', allowed: false, admin: false });
      c.send(snapshot({ clock: clockStart }));
      hostStatus(); broadcastRoster();
    });
    c.on('data', m => hostData(c, m));
    c.on('close', () => { conns = conns.filter(x => x !== c); roster.delete(c.peer); hostStatus(); broadcastRoster(); });
  });
  peer.on('disconnected', () => { if (!peer.gone) peer.reconnect(); });   // destroy() émet aussi 'disconnected'
  peer.on('error', err => {
    if (err.type === 'unavailable-id') { peer.gone = true; peer.destroy(); join(); }   // salle déjà ouverte : on la rejoint
    else setStatus('Erreur réseau (' + err.type + '). Recharge la page.');
  });
}

function join() {
  isHost = false;
  const peer = new Peer();
  const retry = () => { hostConn = null; peer.destroy(); setStatus('Reconnexion…'); setTimeout(start, 1500); };
  peer.on('open', id => {
    myId = id;
    const c = peer.connect(PREFIX + room, { reliable: true });
    hostConn = c; rej = 0;
    c.on('open', () => { setStatus('Connecté', true); announce(); });
    c.on('data', guestData);
    c.on('close', retry);                // l'hôte est parti : on reprend la salle avec notre copie
  });
  peer.on('error', err => {
    if (err.type === 'peer-unavailable') retry();
    else setStatus('Erreur réseau (' + err.type + '). Recharge la page.');
  });
}

// --- Exécution Python (Pyodide dans un Web Worker) ---------------------------
const PYODIDE = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
const workerSrc = `
importScripts('${PYODIDE}pyodide.js');
const ready = loadPyodide({ indexURL: '${PYODIDE}' });
onmessage = async e => {
  let out = '', ms = null;
  const w = s => { out += s + '\\n'; };
  try {
    const py = await ready;
    py.setStdout({ batched: w }); py.setStderr({ batched: w });
    await py.loadPackagesFromImports(e.data);
    postMessage({ started: true });
    const g = py.toPy({ __name__: '__main__' });
    const t0 = performance.now();
    await py.runPythonAsync(e.data, { globals: g });
    ms = performance.now() - t0;
  } catch (err) {
    const m = String(err.message || err), i = m.indexOf('  File "<exec>"');
    out += i >= 0 ? 'Traceback (most recent call last):\\n' + m.slice(i) : m;
  }
  postMessage({ out, ms });
};`;
const workerURL = URL.createObjectURL(new Blob([workerSrc], { type: 'text/javascript' }));
const TIMEOUT_MS = 10000;

// Un interpréteur par éditeur : le brouillon privé tourne dans le sien, et sa sortie
// reste locale. Le second n'est créé qu'au premier lancement privé.
function makeRunner(outEl, publish) {
  let worker = null, timer, busy = false;
  const finish = text => {
    busy = false; refreshRun();
    if (publish) { const m = { t: 'out', text }; handleShared(m); sendAll(m); }
    else outEl.textContent = text;
  };
  const spawn = () => {
    worker = new Worker(workerURL);
    worker.onmessage = e => {
      if (e.data.started) {              // le délai d'exécution démarre une fois Pyodide chargé
        timer = setTimeout(() => { worker.terminate(); spawn(); finish('Arrêté après 10 s. Boucle infinie ?'); }, TIMEOUT_MS);
        return;
      }
      clearTimeout(timer);
      const ms = e.data.ms;
      finish((e.data.out || '(aucune sortie)\n') +
        (ms == null ? '' : '\n[terminé en ' + (ms < 10 ? ms.toFixed(2) : Math.round(ms)) + ' ms]'));
    };
    worker.onerror = e => { clearTimeout(timer); spawn(); finish('Impossible de charger Python : ' + (e.message || 'erreur réseau')); };
  };
  return {
    get busy() { return busy; },
    warm() { if (!worker) spawn(); },
    run(code) {
      if (busy) return;
      if (!worker) spawn();
      busy = true; refreshRun();
      outEl.textContent = 'Exécution… (le premier lancement charge Python, quelques secondes)';
      worker.postMessage(code);
    },
  };
}
const shared = makeRunner($('out'), true);
const priv = makeRunner($('out-priv'), false);
shared.warm();

// --- Onglets partagé / privé -----------------------------------------------------
let activeTab = 'shared';
function showTab(tab) {
  activeTab = tab;
  const p = tab === 'priv';
  $('tabShared').setAttribute('aria-selected', String(!p));
  $('tabPriv').setAttribute('aria-selected', String(p));
  $('ed-shared').hidden = p; $('ed-priv').hidden = !p;
  $('out').hidden = p; $('out-priv').hidden = !p;
  $('outLabel').textContent = p ? 'Sortie privée (toi seul)' : 'Sortie (partagée)';
  $('outLabel').htmlFor = p ? 'out-priv' : 'out';
  document.body.classList.toggle('priv', p);
  (p ? cmP : cm).refresh();              // CodeMirror doit se remesurer après avoir été caché
  (p ? cmP : cm).focus();
  if (p) priv.warm();
  refreshRun();
}
function refreshRun() { $('run').disabled = (activeTab === 'priv' ? priv : shared).busy; }
$('tabShared').addEventListener('click', () => showTab('shared'));
$('tabPriv').addEventListener('click', () => showTab('priv'));
$('run').addEventListener('click', () => activeTab === 'priv' ? priv.run(cmP.getValue()) : shared.run(cm.getValue()));
$('copyShared').addEventListener('click', () => { replaceAll(cmP, cm.getValue()); cmP.focus(); });
$('openFile').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (f) { replaceAll(cmP, await f.text()); cmP.focus(); }
  e.target.value = '';                   // permet de rouvrir le même fichier
});

// --- Panneau admin -------------------------------------------------------------
async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function renderAdmin() {
  $('pwForm').hidden = isAdmin;
  $('adminBody').hidden = !isAdmin;
  $('adminTools').hidden = !isAdmin;
  $('adminBtn').textContent = isAdmin ? 'Admin ✓' : 'Admin';
  renderRoster();
}
function renderRoster() {
  if (!isAdmin) return;
  const ul = $('roster');
  ul.replaceChildren();
  if (!rosterList.length) { ul.append(Object.assign(document.createElement('li'), { textContent: 'Personne pour le moment.' })); return; }
  for (const r of rosterList) {
    const li = document.createElement('li');
    const who = document.createElement('span');
    const tags = [r.id === myId && 'toi', r.id === 'host' && 'hôte', r.admin && 'admin'].filter(Boolean);
    who.textContent = (r.name || 'Sans nom') + (tags.length ? ' (' + tags.join(', ') + ')' : '');
    const lab = document.createElement('label');
    const box = Object.assign(document.createElement('input'), { type: 'checkbox', checked: r.allowed || r.admin, disabled: r.admin });
    box.addEventListener('change', () => {
      if (isHost) setGrant(r.id, box.checked);
      else hostConn?.open && hostConn.send({ t: 'grant', id: r.id, allowed: box.checked });
    });
    lab.append(box, ' Brouillon privé');
    li.append(who, lab);
    ul.append(li);
  }
}
$('adminBtn').addEventListener('click', () => { renderAdmin(); $('adminDlg').showModal(); (isAdmin ? $('adminBody') : $('pw')).focus?.(); });
$('pwForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (await sha256($('pw').value) !== ADMIN_HASH) { $('pwErr').textContent = 'Mot de passe incorrect.'; return; }
  $('pw').value = ''; $('pwErr').textContent = '';
  isAdmin = true; store.set('pad:admin', '1');
  renderAdmin(); announce(); applyRoster(rosterList);
});
$('logout').addEventListener('click', () => {
  isAdmin = false; store.set('pad:admin', '0');
  renderAdmin(); announce(); applyRoster(rosterList);
});
renderAdmin();

// --- Chronomètre partagé ------------------------------------------------------
let clockStart = null;                   // horodatage de départ, ou null si arrêté
function setClock(start) {
  clockStart = typeof start === 'number' ? start : null;
  $('clockBtn').textContent = clockStart ? 'Arrêter le chrono' : 'Démarrer le chrono';
  tick();
}
function tick() {
  const s = clockStart ? Math.max(0, Math.floor((Date.now() - clockStart) / 1000)) : 0;
  $('clock').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
setInterval(tick, 1000);
$('clockBtn').addEventListener('click', () => {
  setClock(clockStart ? null : Date.now());
  sendAll({ t: 'clock', start: clockStart });
});

// --- Sujets prêts à l'emploi (sujets.js), chargés et avancés par l'admin --------
// cur = sujet en cours et nombre d'étapes déjà révélées, gardé par salle pour survivre à un rechargement.
const SKEY = 'pad:sujet:' + room;
let cur = null;
try { cur = JSON.parse(store.get(SKEY) || 'null'); } catch {}
function refreshStep() {
  const n = (typeof SUJETS !== 'undefined' && cur && SUJETS[cur.i]?.suites?.length) || 0;
  $('nextStep').hidden = !n;
  if (!n) return;
  $('nextStep').disabled = cur.step >= n;
  $('nextStep').textContent = cur.step < n ? `Étape suivante (${cur.step + 2}/${n + 1})` : `Sujet terminé (${n + 1}/${n + 1})`;
}
$('nextStep').addEventListener('click', () => {
  const s = SUJETS[cur?.i], n = s?.suites?.length || 0;
  if (!s || cur.step >= n) return;
  const text = s.suites[cur.step].replace(/([^\n])\n(?!\n)/g, '$1 ');   // le panneau replie lui-même les lignes
  cur.step++;
  store.set(SKEY, JSON.stringify(cur));
  notes.value = notes.value.replace(/\s*$/, '') + `\n\n=== ÉTAPE ${cur.step + 1}/${n + 1} ===\n${text}\n`;
  localEdit();
  const m = { t: 'step' };
  handleShared(m); sendAll(m);
  refreshStep();
});
refreshStep();

if (typeof SUJETS !== 'undefined') {
  const sel = $('sujet'), groups = {};
  SUJETS.forEach((s, i) => {
    if (!groups[s.groupe]) {
      groups[s.groupe] = document.createElement('optgroup');
      groups[s.groupe].label = s.groupe;
      sel.append(groups[s.groupe]);
    }
    groups[s.groupe].append(new Option(s.titre, i));
  });
  sel.addEventListener('change', () => {
    const i = Number(sel.value), s = SUJETS[sel.value];
    sel.value = '';
    if (!s || !confirm('Remplacer le sujet et le code, pour tout le monde, par « ' + s.titre + ' » ?')) return;
    const n = s.suites?.length || 0;
    notes.value = (n ? `=== ÉTAPE 1/${n + 1} ===\n` : '') + s.notes + '\n';
    cm.setValue(s.code);
    const m = { t: 'out', text: 'Clique sur Exécuter ou fais Ctrl+Entrée.' };
    handleShared(m); sendAll(m);
    localEdit();                         // setValue n'est pas diffusé automatiquement
    cur = { i, step: 0 };
    store.set(SKEY, JSON.stringify(cur));
    refreshStep();
  });
}

// --- Lien de partage -----------------------------------------------------------
$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(location.href); $('copy').textContent = 'Lien copié'; }
  catch { prompt('Copie ce lien :', location.href); }
  setTimeout(() => { $('copy').textContent = 'Copier le lien'; }, 2000);
});

start();
